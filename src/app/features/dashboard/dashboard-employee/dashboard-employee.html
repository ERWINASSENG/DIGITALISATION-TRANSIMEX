<div class="space-y-6" id="dashboard-employee-view">
  <!-- En-tête Employé / Collaborateur -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs" id="employee-header-card">
    <div>
      <div class="flex items-center gap-2">
        <span class="px-2.5 py-0.5 text-[11px] font-bold tracking-wider uppercase bg-slate-100 text-slate-800 rounded-md border border-slate-200/60">
          Espace Collaborateur
        </span>
        <span class="text-xs text-slate-400">•</span>
        <span class="text-xs text-slate-500 font-medium">TRANSIMEX Opérations</span>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 mt-1.5">
        Bonjour, {{ currentUser()?.firstName }} {{ currentUser()?.lastName }}
      </h1>
      <p class="text-sm text-slate-500 mt-0.5">
        Bienvenue sur votre espace collaborateur Transimex.
      </p>
    </div>

    <!-- Raccourcis -->
    <div class="flex items-center gap-3 shrink-0">
      <a
        routerLink="/profile"
        class="inline-flex items-center gap-2 px-4 py-2.5 bg-[#1e3a8a] hover:bg-blue-900 text-white text-xs font-semibold rounded-xl transition-colors shadow-xs"
        id="employee-btn-profile">
        <span>Mon Profil</span>
      </a>
    </div>
  </div>
</div>
